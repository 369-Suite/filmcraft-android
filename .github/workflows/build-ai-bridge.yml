name: Build FilmCraft AI Bridge APK

on:
  push:
    branches:
      - ai-bridge-v1
      - ai-bridge-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: filmcraft-ai-bridge-v1

      - name: Install Android NDK and cargo-ndk
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null

      - name: Compile debug APK (ARM64)
        working-directory: apps/filmcraft-android/android
        run: ./gradlew assembleDebug "-Pfilmcraft.abis=arm64-v8a" --no-daemon

      - name: Verify APK exists
        run: test -s apps/filmcraft-android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-ai-debug-apk
          path: apps/filmcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
